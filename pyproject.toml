[project]
name = "echo-lab"
version = "0.1.0"
description = "Realtime speech-to-speech translation pipeline built on Pipecat (local models, local audio devices)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[local]==1.14.0",
    # PyTorch with CUDA 12.6 (see tool.uv.sources)
    "torch==2.14.1",
    "torchaudio==2.11.0",
    "torchvision==0.29.1",
    # Hugging Face tokenizers and processors
    "transformers>=5.3.0,<6",
    "accelerate>=1.10",
    "sentencepiece>=0.2",
    # Config and audio files
    "pyyaml>=6",
    "soundfile>=0.13.1",
    # STT
    "nano-parakeet==0.2.1",
    # LLM (translation)
    "ctranslate2>=4.6,<5",
    # TTS
    "omnivoice==0.2.1",
]

[project.scripts]
echo-lab = "echo_lab.cli:main"

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echo_lab"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, import sorting
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["echo_lab"]
