# echo-lab: realtime speech-to-speech translation
### audio in -> vad -> stt -> llm (translation) -> tts -> audio out
#
# Each stage names its `backend`; the section with that backend's name holds
# its options. Every value can be overridden on the command line with
# `--set section.key=value`, e.g. `--set tts.omnivoice.num_step=16`.
# Paths tagged `!path` are relative to the file they're in (here: this file).
#
# This is the base config with every parameter. Presets in presets/ change only
# some of them: `uv run bot.py -p nl1` (several: `-p nl1 -p my_tweaks`).

gpu: 0

audio:
  # PyAudio device index; null = system default. `uv run bot.py --list-devices`
  # lists them; pick an MME or DirectSound entry.
  input_device: null
  output_device: null
  # Silence the microphone while the translation plays, so the speakers aren't
  # picked up and translated again. Not needed with headphones.
  mute_input_while_speaking: false

osc:
  # Change parameters while running by sending OSC messages over UDP to this
  # address, e.g. `/tts/speed 1.2`; see the README for the addresses. 127.0.0.1
  # accepts messages from this computer only, 0.0.0.0 from the network.
  # port: null = off. Bots running at the same time need different ports.
  host: 127.0.0.1
  port: 9000

vad:
  # silero_smart_turn: at each short pause, Smart Turn judges whether the sentence
  #                    is finished; finished sentences end their segment at once
  # fixed_interval:    ignore pauses, cut the audio about every interval_secs
  backend: silero_smart_turn
  silero_smart_turn:
    stop_secs: 0.2          # pause after which Smart Turn is asked whether the sentence is done
    start_secs: 0.1         # speech length before a segment starts
    confidence: 0.7         # minimum Silero speech probability
    min_volume: 0.6         # minimum (smoothed) volume for audio to count as speech
    max_pause_secs: 2.0     # end the segment after this much silence, even mid-sentence
    cpu_threads: 6          # CPU threads for the Smart Turn model
  fixed_interval:
    interval_secs: 1.0
    search_secs: 0.5        # window around the target in which the cut goes at the quietest point (0 = exact cuts)

stt:
  # Parakeet TDT v3 recognizes the spoken language by itself (but doesn't report
  # it), so the language to translate from is set under llm.
  backend: parakeet_tdt
  parakeet_tdt:
    model: nvidia/parakeet-tdt-0.6b-v3
    device: cuda:0

llm:
  # m2m100_ct2:         facebook/m2m100_418M, run with CTranslate2
  # translategemma_ct2: google/translategemma-4b-it, run with CTranslate2: better
  #                     translations; gated on Hugging Face (accept the license,
  #                     then `uv run hf auth login`)
  backend: m2m100_ct2
  # Language the speaker uses, translated from: nl (Dutch), pt (Portuguese), de, ...
  input_language: de
  # Language to translate into: pt (Portuguese) or nl (Dutch). The TTS speaks it.
  output_language: nl
  m2m100_ct2:
    model: facebook/m2m100_418M            # tokenizer, and the weights to convert
    model_dir: !path models/m2m100_418M-ct2-float16  # converted on first run if missing
    device: cuda:0
    compute_type: float16   # int8_float16 = smaller, slightly faster
    beam_size: 4            # 1 = greedy, fastest
    max_new_tokens: 512
  translategemma_ct2:
    model: google/translategemma-4b-it                 # prompt template, tokenizer, weights to convert
    model_dir: !path models/translategemma-4b-it-ct2-bfloat16  # converted on first run if missing (~7 GB)
    device: cuda:0
    compute_type: bfloat16  # Gemma can overflow in float16; int8 was no faster
    max_new_tokens: 512

tts:
  backend: omnivoice
  # Voice to clone: a clean recording of a few seconds (3-10 s works best) and
  # its transcript. Set ref_audio to null to use the model's own voice.
  ref_audio: !path recordings/tims_test_recording.wav
  ref_text: "This is an example of my voice speaking English because I cannot speak Dutch or Portuguese. I am sorry, so, so sorry."
  omnivoice:
    model: k2-fsa/OmniVoice
    device: cuda:0
    dtype: float16
    # Diffusion steps: fewer = faster, more = cleaner. Try 16 (about twice as
    # fast) or 24; same as `--set tts.omnivoice.num_step=16` for a single run.
    num_step: 32
    # Also changeable while running, over OSC (/tts/<name>):
    speed: null             # speaking rate factor (>1 faster); null = model decides
    guidance_scale: 2.0     # how strongly the speech follows the text and voice; 0 = off
    t_shift: 0.1            # diffusion time-step shift; smaller = more steps on the noisy start
    denoise: true           # clean speech even if the reference recording is noisy
